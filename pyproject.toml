[project]
name = "omni-resolve"
version = "0.1.0"
description = "Unified Omnichannel E-Commerce Dispute Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LLM / agent orchestration
    "anthropic>=0.40.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langsmith>=0.1.140",
    # Graph database
    "neo4j>=5.26.0",
    # Embeddings + reranking
    "openai>=1.50.0",
    "cohere>=5.11.0",
    # XGBoost classifier
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # Voice STT
    "openai-whisper>=20240930",
    # API + WebSocket
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    # Dashboard
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    # Database (LangGraph checkpoints)
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    # Caching + production
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Utilities
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "pypdf>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
omni-resolve = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
